<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MultimediaMX logo — © 2026 Santiago Miguel — GPL-3.0-or-later -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="0.55" stop-color="#120f2c"/>
      <stop offset="1" stop-color="#0a0818"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee6ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff5e8a"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#ff9a6b"/>
      <stop offset="1" stop-color="#ff5e8a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>

  <g fill="none" stroke="url(#ring)" stroke-linecap="round" filter="url(#soft)">
    <!-- outer wave ring, open at the lower right -->
    <path d="M 512 168 A 344 344 0 1 0 802 696" stroke-width="30" opacity="0.95"/>
    <!-- middle ring -->
    <path d="M 512 238 A 274 274 0 1 1 288 670" stroke-width="22" opacity="0.75"/>
    <!-- inner ring -->
    <path d="M 512 308 A 204 204 0 1 0 712 552" stroke-width="14" opacity="0.55"/>
  </g>

  <!-- sound bars on the opening of the outer ring -->
  <g fill="url(#ring)">
    <rect x="828" y="560" width="22" height="70"  rx="11" opacity="0.9"/>
    <rect x="866" y="530" width="22" height="130" rx="11"/>
    <rect x="904" y="575" width="22" height="40"  rx="11" opacity="0.7"/>
  </g>

  <!-- play glyph with rounded corners -->
  <path d="M 452 404
           C 452 380 476 366 497 378
           L 640 468
           C 660 480 660 508 640 520
           L 497 610
           C 476 622 452 608 452 584 Z"
        fill="url(#play)" filter="url(#soft)"/>

  <rect x="32" y="32" width="960" height="480" rx="224" fill="url(#shine)"/>
</svg>
