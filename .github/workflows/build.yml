# MultimediaMX — compilación de instaladores para macOS, Windows, Linux y Android
# Se ejecuta en cada push a main (artefactos) y adjunta los instaladores al publicar un Release.
name: Instaladores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            cmd: npx electron-builder --linux --x64 --publish never
          - os: windows-latest
            name: windows
            cmd: npx electron-builder --win --x64 --publish never
          - os: macos-latest
            name: macos-arm64
            cmd: npx electron-builder --mac --arm64 --publish never
          - os: macos-latest
            name: macos-x64
            arch: x64
            cmd: npx electron-builder --mac --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: FFmpeg para Intel (Mac x64)
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg
      - run: npm run build
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MultimediaMX-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Renombrar APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/MultimediaMX-${VERSION}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MultimediaMX-android
          path: release/*.apk
          if-no-files-found: error

  release:
    # Publica automáticamente vX.Y.Z (versión de package.json) si aún no existe,
    # o adjunta los instaladores a un Release creado a mano desde GitHub.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versión y etiqueta
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "El release $TAG ya existe; no se vuelve a publicar."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.go == 'true'
        with: { path: artifacts, merge-multiple: true }
      - run: ls -la artifacts
        if: steps.v.outputs.go == 'true'
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.go == 'true'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MultimediaMX ${{ steps.v.outputs.tag }}
          make_latest: true
          files: artifacts/*
          body: |
            Instaladores de MultimediaMX ${{ steps.v.outputs.tag }} — software libre bajo GPL-3.0-or-later.

            | Sistema | Archivo |
            |---|---|
            | Windows 10/11 (64 bits) | `MultimediaMX-*-Windows-Setup.exe` |
            | macOS Apple Silicon (M1–M4) | `MultimediaMX-*-macOS-arm64.dmg` |
            | macOS Intel | `MultimediaMX-*-macOS-x64.dmg` |
            | Linux (cualquier distribución) | `MultimediaMX-*-Linux-x86_64.AppImage` |
            | Debian / Ubuntu / Mint | `multimediamx_*_amd64.deb` |
            | Android 7.0 o superior | `MultimediaMX-*-Android.apk` |

            **macOS:** la app no está firmada por Apple. La primera vez, haz clic derecho sobre MultimediaMX → «Abrir», o ejecuta `xattr -cr /Applications/MultimediaMX.app`.
            **Android:** permite la instalación desde «orígenes desconocidos».
