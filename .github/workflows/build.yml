# MultimediaMX — compilación de instaladores para macOS, Windows, Linux y Android
# Se ejecuta en cada push a main (artefactos) y publica un Release al subir una etiqueta v*.
name: Instaladores

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            cmd: npx electron-builder --linux --x64 --publish never
          - os: windows-latest
            name: windows
            cmd: npx electron-builder --win --x64 --publish never
          - os: macos-latest
            name: macos-arm64
            cmd: npx electron-builder --mac --arm64 --publish never
          - os: macos-latest
            name: macos-x64
            arch: x64
            cmd: npx electron-builder --mac --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: FFmpeg para Intel (Mac x64)
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg
      - run: npm run build
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MultimediaMX-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Renombrar APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/MultimediaMX-${VERSION}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MultimediaMX-android
          path: release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MultimediaMX ${{ github.ref_name }}
          files: artifacts/*
          body: |
            Instaladores de MultimediaMX ${{ github.ref_name }} — software libre bajo GPL-3.0-or-later.

            | Sistema | Archivo |
            |---|---|
            | Windows 10/11 (64 bits) | `MultimediaMX-*-Windows-Setup.exe` |
            | macOS Apple Silicon (M1–M4) | `MultimediaMX-*-macOS-arm64.dmg` |
            | macOS Intel | `MultimediaMX-*-macOS-x64.dmg` |
            | Linux (cualquier distribución) | `MultimediaMX-*-Linux-x86_64.AppImage` |
            | Debian / Ubuntu / Mint | `multimediamx_*_amd64.deb` |
            | Android 7.0 o superior | `MultimediaMX-*-Android.apk` |

            **macOS:** la app no está firmada por Apple. La primera vez, haz clic derecho sobre MultimediaMX → «Abrir», o ejecuta `xattr -cr /Applications/MultimediaMX.app`.
            **Android:** permite la instalación desde «orígenes desconocidos».
